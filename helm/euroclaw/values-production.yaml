replicaCount: 2

image:
  repository: ghcr.io/your-org/euroclaw
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

env:
  EXECUTION_MODE: distributed
  API_VERSION: v1
  RATE_LIMIT_REQUESTS: "120"
  RATE_LIMIT_WINDOW_SECONDS: "60"

secrets:
  existingSecret: euroclaw-secrets
